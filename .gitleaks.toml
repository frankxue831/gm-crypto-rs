# gitleaks configuration for gm-crypto-rs
#
# An authoritative `gitleaks git` pass over the full history (2026-05-24)
# found NO real secrets. The only matches are intentional, published test
# vectors / parser-rejection test strings — documented and allowlisted
# below so the committed-history CI scan and future sweeps stay green and
# reviewers can see the matches are deliberate. See the
# "2026-05-24 pre-flip dry-run" note in docs/pre-opensource-audit.md.
#
# This crate is a cryptography library: KAT (Known-Answer-Test) sourcing
# docs embed published oracle test-vector hex, and the PEM parser's unit
# tests necessarily contain key-shaped strings. None are real keys.

title = "gm-crypto-rs gitleaks config"

# Start from gitleaks' built-in ruleset; we only ADD allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "Intentional test vectors and parser-rejection fixtures (no real keys)."
# Match on file path: every entry below is, by nature, test material.
paths = [
  # gmssl-generated throwaway KAT fixtures (the .pem is a *password-encrypted*
  # PKCS#8 blob whose password is also in the test; never a production key).
  '''crates/gmcrypto-core/tests/data/.*\.pem$''',
  # The PEM parser's own unit tests use deliberately malformed
  # "-----BEGIN PRIVATE KEY-----" strings to exercise rejection paths.
  '''crates/gmcrypto-core/src/pem\.rs$''',
  # AEAD / XTS KAT sourcing docs embed published oracle test-vector hex
  # (keys, nonces, ciphertexts) in their reproduce recipes.
  '''docs/v0\.8-ccm-kat-sourcing\.md$''',
  '''docs/v0\.12-xts-kat-sourcing\.md$''',
  # Build artifacts: gitignored and never published, but a working-tree
  # `gitleaks dir` scan still walks them, and test binaries bake KAT hex in.
  # (The publication-relevant `gitleaks git` history scan never sees them.)
  '''^target/''',
  # The committed cargo-fuzz seed corpus is curated test material by
  # definition — `fuzz_pem`'s seeds are PEM-shaped on purpose, since a PEM
  # parser cannot be fuzzed with inputs that are not PEM-shaped. Same
  # rationale as the tests/data/ entry above; scoped to seeds/ only, so a
  # real key committed anywhere else under fuzz/ still trips the scanner.
  '''^fuzz/seeds/.*\.pem$''',
]

# The three entries below suppress `generic-api-key` — the default ruleset's
# broadest, most heuristic rule — at three EXACT sites. Each requires the path
# AND the regex to match (`condition = "AND"`), and each names the single rule
# it silences, so nothing else in these files, and no other rule anywhere, is
# affected. Allowlisting the whole file (or all of `fuzz/`, or all of
# `.github/`) would be the easy version and would suppress a genuine future
# leak in the same tree.

[[allowlists]]
description = "Toolchain pin date read as an API key (api-stability.yml)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^\.github/workflows/api-stability\.yml$''']
regexes = ['''nightly-\d{4}-\d{2}-\d{2}''']

[[allowlists]]
description = "English prose in the TLCP decomposition doc read as an API key."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^docs/tlcp-decomposition\.md$''']
regexes = ['''\d+-byte-length-prefixed''']

[[allowlists]]
description = "A gmcrypto-core type name in a fuzz target read as an API key."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^fuzz/fuzz_targets/fuzz_sm2_verify\.rs$''']
regexes = ['''Sm2PrivateKey''']
