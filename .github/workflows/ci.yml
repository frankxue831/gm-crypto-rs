name: CI

# RESEARCH ONLY — branch `research/v1.16-gfni-x4-measure`, never merged.
# v1.16 §7: measure GFNI `sbox_x4` against four scalar calls on the same
# hosted GFNI runner (x4 10% rule: key construction AND pre-keyed
# single-block encryption). Dispatched with
# `gh workflow run ci.yml --ref research/v1.16-gfni-x4-measure`; a run on
# a CPU without GFNI records the CPU and measures nothing.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: v1.16 GFNI x4 measurement (research, never merge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Host
        run: |
          echo "RUNNER-CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          rustc -Vv
          git log --oneline -3
          if grep -qw gfni /proc/cpuinfo; then
            echo "GFNI=1" >> "$GITHUB_ENV"
          else
            echo "NO-GFNI: this runner cannot measure; dispatch again"
            echo "GFNI=0" >> "$GITHUB_ENV"
          fi
      - name: Build GFNI-x4 and scalar-x4 binaries
        if: env.GFNI == '1'
        run: |
          cargo build --release -p gmcrypto-core --features sm4-bitsliced-simd --example sm4_single_block --target-dir tgt-gfni
          # HEAD~1 is the research commit without the GFNI x4 dispatch.
          git show HEAD~1:crates/gmcrypto-simd/src/sm4/sbox_x4.rs > crates/gmcrypto-simd/src/sm4/sbox_x4.rs
          git diff --stat
          cargo build --release -p gmcrypto-core --features sm4-bitsliced-simd --example sm4_single_block --target-dir tgt-base
      - name: Measure (5 alternating samples each)
        if: env.GFNI == '1'
        run: |
          for i in 1 2 3 4 5; do
            ./tgt-base/release/examples/sm4_single_block base
            ./tgt-gfni/release/examples/sm4_single_block gfni
          done
