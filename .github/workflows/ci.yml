name: CI

# RESEARCH ONLY — branch `research/v1.16-gfni-measure`, never merged.
# v1.16 Q16.5 (docs/v1.16-scope.md): measure the GFNI S-box against the AVX2
# S-box on the same hosted GFNI runner. Dispatched with
# `gh workflow run ci.yml --ref research/v1.16-gfni-measure`; a run on a
# CPU without GFNI records the CPU and measures nothing.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: v1.16 GFNI measurement (research, never merge)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Host
        run: |
          echo "RUNNER-CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          rustc -Vv
          git log --oneline -3
          if grep -qw gfni /proc/cpuinfo; then
            echo "GFNI=1" >> "$GITHUB_ENV"
          else
            echo "NO-GFNI: this runner cannot measure; dispatch again"
            echo "GFNI=0" >> "$GITHUB_ENV"
          fi
      - name: Build GFNI-dispatch and baseline-dispatch binaries
        if: env.GFNI == '1'
        run: |
          cargo build --release -p gmcrypto-simd --example gfni_measure --target-dir tgt-gfni
          cargo build --release -p gmcrypto-core --features sm4-bitsliced-simd --example sm4_batch_throughput --target-dir tgt-gfni
          # HEAD~1 is the research commit without the GFNI dispatch line.
          git show HEAD~1:crates/gmcrypto-simd/src/sm4/sbox_x32.rs > crates/gmcrypto-simd/src/sm4/sbox_x32.rs
          git diff --stat
          cargo build --release -p gmcrypto-core --features sm4-bitsliced-simd --example sm4_batch_throughput --target-dir tgt-base
      - name: Measure (5 alternating samples each)
        if: env.GFNI == '1'
        run: |
          ./tgt-gfni/release/examples/gfni_measure
          for i in 1 2 3 4 5; do
            ./tgt-base/release/examples/sm4_batch_throughput base
            ./tgt-gfni/release/examples/sm4_batch_throughput gfni
          done
