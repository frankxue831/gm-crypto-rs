name: CI

# v0.17+ — GitHub-hosted runners.
#
# Most jobs (build / msrv / cabi / deny / wasm32) run on GitHub-hosted
# `macos-14` (aarch64) — the same macOS-aarch64 platform the project
# targets (NEON SIMD + C-ABI coverage). Two jobs run on Linux/x86_64:
# `simd-x86` (`ubuntu-latest`) exercises the AVX2 / PCLMULQDQ paths the
# aarch64 hosts can't reach (F17), and `interop-gmssl` (`ubuntu-24.04`,
# OS label pinned because a from-source build's reproducibility rides the
# runner's compiler) cross-validates the wire format against a pinned GmSSL
# build (F16). The separate `gitleaks.yml` workflow scans all eligible PRs and
# main pushes, including doc-only pushes skipped by this workflow. GitHub
# Actions on standard runners is free for public repositories.
#
# History: through v0.16 these ran on a self-hosted macOS runner to dodge
# GitHub Pro's private-repo minute cap. That runner was retired at the
# v0.17 public flip — a self-hosted runner on a PUBLIC repo is remote
# code execution (any fork PR would run on the host). See
# docs/pre-opensource-audit.md (item C1).
#
# The dudect workflows (`dudect-pr.yml`, `dudect-nightly.yml`) run on
# `ubuntu-24.04` and DO NOT move — their `|tau|` gates were empirically
# calibrated against the GitHub Actions `ubuntu-24.04` runner image's
# noise floor (see CLAUDE.md dudect table / docs/v0.5-dudect-recalibration.md).
# Moving them would invalidate the calibration.
#
# Convention: `dtolnay/rust-toolchain@*` invocations use the `@stable`
# tag (the action's release tag, not the toolchain); the Rust toolchain
# version is controlled via the action's `toolchain:` input.

on:
  push:
    branches: [main]
    # Skip doc-only / repo-meta-only changes on PUSH only (a post-merge doc
    # push to `main` was already validated by its PR). The dudect workflows use
    # their own (allowlist) `paths:` filter; this list is the inverse for
    # ci.yml's broader build/test surface.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE-*'                        # LICENSE-APACHE / LICENSE-MIT (root + per-crate)
      - '**/LICENSE-*'
      - '.gitignore'
      - 'docs/**'                          # scope docs, runbooks, release reviews
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main]
    # NO paths-ignore here (deliberately, unlike `push` above): several of this
    # workflow's jobs are REQUIRED status checks in `main`'s branch protection.
    # If a doc-only PR skipped them, those required checks would never report
    # and the PR would be permanently blocked ("Expected/pending", as #90 hit).
    # Running them on a doc-only PR is cheap (no crate source changed, so they
    # pass quickly) and keeps the gate honest — the real checks actually run,
    # rather than being reported green by a no-op shim.
  # Manual fire — useful for stacked PRs (where the PR base isn't `main`,
  # so the `pull_request: branches: [main]` filter wouldn't fire) and
  # for re-running CI on a branch without an empty-commit push.
  workflow_dispatch:

# Cancel outdated runs on the same ref (branch / PR). During
# rapid-iteration cycles where a force-push or follow-up commit lands
# seconds after the previous one, this avoids spending runner minutes on
# a superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Skip-CI gate. GitHub honors `[skip ci]` / `[ci skip]` / `[no ci]` /
# `[skip actions]` natively on `push` events (the workflow run is never
# created), but NOT on `pull_request` events. The job-level `if:` below
# closes that gap by checking the PR title and the PR head commit
# message. On push events, both `github.event.pull_request.*` lookups
# return null and `contains(null, ...)` is false, so the gate is a
# no-op there (GitHub's native skip already handled it).
#
# YAML anchors don't work inside GitHub Actions `if:` directly, so the
# expression is repeated per-job below. Keep them in lock-step.

permissions:
  contents: read

jobs:
  build:
    name: build & test (Rust stable)
    runs-on: macos-14
    # Skip-CI gate for `pull_request` events (GitHub natively handles push).
    # Checks the PR title for `[skip ci]` etc. Same expression appears on
    # every job in this workflow — keep them in lock-step.
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify assurance workflow policy
        shell: bash
        run: python3 .github/scripts/check_assurance_policy.py
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build (all targets, including bench compile-only)
        run: cargo build --workspace --all-targets
      - name: cargo test (tests + doctests; benches excluded — see dudect-pr.yml)
        run: cargo test --workspace
      # v0.4 W2 — RustCrypto-trait fit, opt-in features. Default-features
      # build above already gates the no-extra-deps shape. This run
      # exercises the digest/cipher trait impls + the rustcrypto_traits
      # integration test (which is `required-features`-gated and only
      # builds when both flags are on).
      - name: cargo test --features digest-traits,cipher-traits
        run: cargo test -p gmcrypto-core --features digest-traits,cipher-traits
      # v0.4 W3 — bitsliced SM4 S-box (Q4.9 / Q4.11 in docs/v0.4-scope.md).
      # Default-features build is unchanged; this exercises the opt-in
      # bitsliced path including the exhaustive-vs-table equivalence test
      # in `sm4::sbox_bitsliced::tests::bitsliced_matches_table`.
      - name: cargo test --features sm4-bitsliced
        run: cargo test -p gmcrypto-core --features sm4-bitsliced
      # v0.5 W4 (phase 1) — `sm4-bitsliced-simd` is the multi-block
      # SIMD-packed dispatch path. Phase 1 transparently delegates to
      # the single-block bitslice; phase 2 / phase 3 swap in AVX2 /
      # NEON intrinsics. The exhaustive equivalence test in
      # `sm4::sbox_bitsliced_simd::tests` guards byte-identical output
      # across all phases.
      - name: cargo test --features sm4-bitsliced-simd
        run: cargo test -p gmcrypto-core --features sm4-bitsliced-simd
      # v0.5 W5 — `crypto-bigint-scalar` exposes `Sm2PrivateKey::from_scalar`.
      # The dudect bench harness uses `from_scalar` (renamed from
      # `new` in v0.5) and `required-features` on it gates this. The
      # test pass here catches `cfg`-conditional code drift.
      - name: cargo test --features crypto-bigint-scalar
        run: cargo test -p gmcrypto-core --features crypto-bigint-scalar
      # v0.8 W2-W3 / v0.9 — SM4-GCM + SM4-CCM AEAD (+ tag-len param +
      # incremental-input buffered GCM). Exercise the feature alone and
      # combined with the SIMD cipher path (the most-demanding stack).
      # Previously uncovered by ci.yml — only the dudect matrix touched
      # sm4-aead.
      - name: cargo test --features sm4-aead
        run: cargo test -p gmcrypto-core --features sm4-aead
      - name: cargo test --features sm4-aead,sm4-bitsliced-simd
        run: cargo test -p gmcrypto-core --features sm4-aead,sm4-bitsliced-simd
      # Issue #163 follow-up (L0 evidence) — the GB/T 32907 A.1 million-round
      # KAT is `#[ignore]`d in the default sweep (debug-build cost). Under
      # `sm4-bitsliced-simd` on this AArch64 host, serial `tau` takes the
      # NEON `sbox_x4` staging path; running the KAT in release here makes
      # the end-to-end cipher composition a CI fact on the arch the repair
      # was measured on. The x86_64 twin lives in the `simd-x86` job.
      - name: GB/T 32907 A.1 million-round KAT under sm4-bitsliced-simd (AArch64, release)
        run: cargo test -p gmcrypto-core --release --lib --features sm4-bitsliced-simd gbt32907_one_million_rounds -- --ignored

      # v1.1 — SM2 key exchange (GM/T 0003.3). Pure-core opt-in; the KAT
      # integration test (sm2_kx_kat) is cfg-gated on the feature.
      - name: cargo test --features sm2-key-exchange
        run: cargo test -p gmcrypto-core --features sm2-key-exchange

      # v1.3 — X.509-with-SM2 leaf parse+verify. Pure-core opt-in; the KAT
      # integration test (x509_kat) is cfg-gated on the feature.
      - name: cargo test --features x509
        run: cargo test -p gmcrypto-core --features x509
      # v1.6 — TLCP key schedule; the integration test
      # (tlcp_key_schedule_kat) is cfg-gated on the feature.
      - name: cargo test --features tlcp
        run: cargo test -p gmcrypto-core --features tlcp
      # v1.11 — RustCrypto `aead` 0.6 trait fit. This leg is not optional
      # bookkeeping: `tests/rustcrypto_aead_traits.rs` is a
      # `required-features`-gated [[test]] target, so a plain
      # `cargo test --workspace` never builds or runs it.
      - name: cargo test --features aead-traits
        run: cargo test -p gmcrypto-core --features aead-traits
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy --features digest-traits,cipher-traits
        run: cargo clippy -p gmcrypto-core --features digest-traits,cipher-traits --all-targets -- -D warnings
      - name: cargo clippy --features sm4-bitsliced
        run: cargo clippy -p gmcrypto-core --features sm4-bitsliced --all-targets -- -D warnings
      - name: cargo clippy --features sm4-bitsliced-simd
        run: cargo clippy -p gmcrypto-core --features sm4-bitsliced-simd --all-targets -- -D warnings
      - name: cargo clippy --features sm4-aead (full matrix)
        run: cargo clippy -p gmcrypto-core --features sm4-aead,sm4-bitsliced-simd,digest-traits,cipher-traits,crypto-bigint-scalar,sm2-key-exchange,x509,tlcp,aead-traits --all-targets -- -D warnings
      - name: cargo clippy --features crypto-bigint-scalar
        run: cargo clippy -p gmcrypto-core --features crypto-bigint-scalar --all-targets -- -D warnings
      - name: cargo clippy --features sm2-key-exchange
        run: cargo clippy -p gmcrypto-core --features sm2-key-exchange,crypto-bigint-scalar --all-targets -- -D warnings
      - name: cargo clippy --features x509
        run: cargo clippy -p gmcrypto-core --features x509 --all-targets -- -D warnings
      - name: cargo clippy --features tlcp
        run: cargo clippy -p gmcrypto-core --features tlcp --all-targets -- -D warnings
      - name: cargo clippy --features aead-traits
        run: cargo clippy -p gmcrypto-core --features aead-traits --all-targets -- -D warnings

  msrv:
    # MSRV-only build check. Behaviour is rust-version-independent, so
    # we don't repeat `cargo test` here — that's the `build` job's role
    # on stable. This row exists solely to prove the crate (and its
    # opt-in feature combos) still compile on the pinned MSRV. Saves
    # ~30s per CI run vs. running the full test+clippy matrix twice.
    # See discussion in rust-lang/api-guidelines#231.
    name: build (Rust 1.85 MSRV)
    runs-on: macos-14
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85
        # `@stable` is the action's release tag (not the toolchain);
        # `toolchain:` picks the Rust version per Cargo's MSRV (1.85).
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.85
      - name: cargo build (all targets)
        run: cargo build --workspace --all-targets
      - name: cargo build with opt-in features
        run: cargo build -p gmcrypto-core --features digest-traits,cipher-traits,sm4-bitsliced,sm4-bitsliced-simd,sm4-aead,sm4-xts,crypto-bigint-scalar,sm2-key-exchange,x509,tlcp,aead-traits --all-targets

  simd-x86:
    # F17 — the SIMD backend's x86_64 intrinsic paths (AVX2 S-box via
    # sbox_x8/x32, PCLMULQDQ GHASH) are exercised by no other CI job: the
    # build/test jobs run on macos-14 (aarch64), which only covers the
    # NEON/PMULL paths. This job runs gmcrypto-simd's correctness tests
    # (lane-equivalence, lane-position, ghash-KAT, software-vs-CLMUL) on an
    # x86_64 host so the AVX2/CLMUL code is gated in CI, not just nightly-fuzzed.
    #
    # Issue #163 follow-up (L0 evidence) — the three core-level steps below
    # are the ONLY x86_64 coverage of the `sm4-bitsliced-simd` COMPOSITION:
    # `tau` → `sbox_x4` (four scalar circuit calls on x86_64, a different
    # branch from the NEON x16 staging that macos-14 tests), key schedule,
    # CBC/GCM/CCM/XTS modes, and runtime dispatch via `cpufeatures`.
    # `cargo test -p gmcrypto-simd` alone tests the primitive, not the
    # cipher built on it. The million-round KAT (GB/T 32907 A.1) is
    # `#[ignore]`d in the default sweep; run here in release under the
    # feature, it is the strongest single sentinel that exactly four
    # S-box evaluations per `tau`, in the right byte order, compose into
    # the standard cipher 32M times over. The job name is unchanged
    # deliberately (it may be referenced by branch protection).
    name: gmcrypto-simd tests (x86_64)
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    # Was 15 when the job ran only the simd crate's tests; the two core
    # debug test passes plus one release lib build need headroom on a
    # cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: simd-x86
      - name: cargo test -p gmcrypto-simd (x86_64 AVX2 / CLMUL paths)
        run: cargo test -p gmcrypto-simd
      - name: cargo test -p gmcrypto-core --features sm4-bitsliced-simd (x86_64 composition)
        run: cargo test -p gmcrypto-core --features sm4-bitsliced-simd
      - name: cargo test -p gmcrypto-core --features sm4-aead,sm4-bitsliced-simd (x86_64 composition)
        run: cargo test -p gmcrypto-core --features sm4-aead,sm4-bitsliced-simd
      - name: GB/T 32907 A.1 million-round KAT under sm4-bitsliced-simd (x86_64, release)
        run: cargo test -p gmcrypto-core --release --lib --features sm4-bitsliced-simd gbt32907_one_million_rounds -- --ignored

  interop-gmssl:
    # F16 — the gmssl cross-validation suite is the project's headline wire
    # guarantee, and until this job it ran in NO CI job: nothing set
    # `GMCRYPTO_GMSSL`, so every test in `interop_gmssl.rs` self-skipped and
    # reported `ok`. CI logs showed green lines named `gmssl_sm2_*` that had
    # executed nothing.
    #
    # The oracle is PINNED and built from source. That is load-bearing, not
    # stylistic: GmSSL renames subcommands and narrows input ranges between
    # releases (3.2.0 renamed `pbkdf2` -> `sm3_pbkdf2`, split `sm4 -cbc` into
    # `sm4_cbc`, and narrowed `sm3hmac` keys to 12..=32 bytes), and Homebrew
    # installs whatever is current. An unpinned oracle silently changes what
    # "interop passes" even means.
    #
    # Running an x86_64 source build here while the maintainer's local oracle
    # is an aarch64 Homebrew build is deliberate: two independent instances of
    # the reference implementation agreeing is stronger evidence than one.
    #
    # A real wire mismatch is gating. Oracle infrastructure is not: cache,
    # acquisition/build, and version-drift failures are tolerated at the STEP
    # level, reported explicitly, and cause the suite to be skipped. This keeps
    # a third-party outage from blocking every PR without turning a skipped
    # suite into an interoperability pass.
    name: gmssl interop (mismatch gates; infra non-blocking)
    runs-on: ubuntu-24.04
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 25
    env:
      # Bump GMSSL_TAG to move the oracle (and update DEFAULT_GMSSL_VERSION in
      # crates/gmcrypto-core/tests/interop_gmssl.rs to match). Bump
      # GMSSL_CACHE_EPOCH when the cmake flags below change — a flag change
      # does NOT move the tag, so the key would otherwise restore a binary
      # built the old way.
      GMSSL_TAG: v3.2.0
      GMSSL_CACHE_EPOCH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: interop-gmssl
      - name: Cache GmSSL install prefix
        id: gmssl-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/gmssl-${{ env.GMSSL_TAG }}
          key: gmssl-${{ runner.os }}-${{ runner.arch }}-${{ env.GMSSL_TAG }}-static-${{ env.GMSSL_CACHE_EPOCH }}
          # NO `restore-keys`, deliberately. A fuzzy/prefix restore would
          # satisfy the cache with a WRONG-VERSION binary — precisely the
          # failure this job exists to prevent.
      - name: Provision GmSSL ${{ env.GMSSL_TAG }} oracle
        id: gmssl-provision
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.gmssl-cache.outputs.cache-hit }}
        run: |
          set -euxo pipefail
          if [[ ! "$GMSSL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid GMSSL_TAG: $GMSSL_TAG"
            exit 1
          fi
          prefix="$HOME/gmssl-$GMSSL_TAG"
          oracle="$prefix/bin/gmssl"
          source_dir="$RUNNER_TEMP/gmssl-src"
          want="GmSSL ${GMSSL_TAG#v}"
          cache_usable=false
          if [ "$CACHE_HIT" = "true" ] && [ -x "$oracle" ]; then
            cached_version="$("$oracle" version 2>/dev/null | head -n1 || true)"
            if [ "$cached_version" = "$want" ]; then
              cache_usable=true
            fi
          fi
          if [ "$cache_usable" != "true" ]; then
            if [ "$CACHE_HIT" = "true" ]; then
              echo "::warning title=Unusable GmSSL cache::repairing this run only because exact caches are immutable; bump GMSSL_CACHE_EPOCH to replace it"
            fi
            case "$prefix" in
              "$HOME"/gmssl-v*) ;;
              *) echo "::error::refusing to clean unexpected GmSSL prefix: $prefix"; exit 1 ;;
            esac
            rm -rf -- "$prefix" "$source_dir"
            git clone --depth 1 --branch "$GMSSL_TAG" \
              https://github.com/guanzhi/GmSSL.git "$source_dir"
            # BUILD_SHARED_LIBS defaults to ON upstream, which yields a binary
            # linked against @rpath/libgmssl. Static keeps the cached artifact
            # self-contained, so a cache restore needs no LD_LIBRARY_PATH or
            # ldconfig to produce a runnable `gmssl`.
            cmake -S "$source_dir" -B "$source_dir/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "$source_dir/build" --parallel
            cmake --install "$source_dir/build"
          fi
          test -x "$oracle"
      # Needed on a cache hit as well as a fresh build; skipped only when the
      # tolerated provisioning step could not produce a usable oracle.
      - name: Put gmssl on PATH
        if: steps.gmssl-provision.outcome == 'success'
        run: echo "$HOME/gmssl-$GMSSL_TAG/bin" >> "$GITHUB_PATH"
      - name: Assert oracle version (drift guard)
        id: gmssl-version
        if: steps.gmssl-provision.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          want="GmSSL ${GMSSL_TAG#v}"
          got="$(gmssl version | head -n1)"
          if [ "$got" != "$want" ]; then
            echo "::error::ORACLE DRIFT - NOT a gmcrypto-core regression."
            echo "  expected: $want"
            echo "  found:    $got"
            echo "This job pins its reference implementation. A mismatch means the"
            echo "GmSSL tag, cache, or build moved - not that our wire output changed."
            echo "Fix: correct GMSSL_TAG, or bump GMSSL_CACHE_EPOCH, or re-baseline."
            exit 1
          fi
          echo "oracle: $got"
      # `--features sm4-aead` reaches 13 tests rather than the 11 a
      # default-features run sees: the two SM4-GCM interop tests are cfg-gated
      # on that feature.
      - name: gmssl interop suite (13 tests)
        id: gmssl-suite
        if: steps.gmssl-provision.outcome == 'success' && steps.gmssl-version.outcome == 'success'
        shell: bash
        env:
          GMCRYPTO_GMSSL: '1'
        run: |
          set -euo pipefail
          cargo test -p gmcrypto-core --test interop_gmssl --features sm4-aead \
            -- --nocapture 2>&1 | tee interop.txt
          # The suite self-skips - and PASSES - when GMCRYPTO_GMSSL is unset.
          # If the variable ever fails to reach the test process, all 13 report
          # green while testing nothing. Same bug class as the missing seeds
          # dir that mis-reported 44 consecutive nightly runs as CRASH.
          if grep -q 'skipping: GMCRYPTO_GMSSL' interop.txt; then
            echo "::error::interop tests SKIPPED - GMCRYPTO_GMSSL did not reach the test process"
            exit 1
          fi
          # Census guard: catches a test being added without this count moving.
          # Brittle to libtest output-format changes; the skip check above is
          # the load-bearing one.
          if ! grep -qE '13 passed' interop.txt; then
            echo "::error::expected 13 interop tests to pass - census drifted"
            exit 1
          fi
      - name: Report GmSSL interoperability status
        if: ${{ always() }}
        shell: bash
        env:
          CACHE_OUTCOME: ${{ steps.gmssl-cache.outcome }}
          PROVISION_OUTCOME: ${{ steps.gmssl-provision.outcome }}
          VERSION_OUTCOME: ${{ steps.gmssl-version.outcome }}
          SUITE_OUTCOME: ${{ steps.gmssl-suite.outcome }}
        run: |
          set -euo pipefail
          case "$SUITE_OUTCOME" in
            success|failure) interop_state=ran ;;
            skipped) interop_state=skipped ;;
            cancelled) interop_state=cancelled ;;
            *) interop_state=unknown ;;
          esac
          echo "INTEROP_SUITE=$interop_state"
          {
            echo "### GmSSL interoperability status"
            echo
            echo "INTEROP_SUITE=\`$interop_state\`"
            echo
            echo "- cache: \`$CACHE_OUTCOME\`"
            echo "- provision: \`$PROVISION_OUTCOME\`"
            echo "- version assertion: \`$VERSION_OUTCOME\`"
            echo "- interoperability suite: \`$SUITE_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROVISION_OUTCOME" != "success" ] || [ "$VERSION_OUTCOME" != "success" ]; then
            echo "::warning title=GmSSL infrastructure unavailable::cache=$CACHE_OUTCOME provision=$PROVISION_OUTCOME version=$VERSION_OUTCOME suite=$SUITE_OUTCOME"
            {
              echo "The interoperability suite was not run because the pinned oracle could not be prepared."
              echo
              echo "This is non-blocking infrastructure telemetry, not an interoperability pass."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CACHE_OUTCOME" != "success" ]; then
            echo "::warning title=GmSSL cache degraded::cache=$CACHE_OUTCOME; fallback provisioning succeeded; suite=$SUITE_OUTCOME"
            {
              echo "The cache step failed, but fallback provisioning and version validation succeeded."
              echo
              echo "Fallback provisioning recovered the cache failure; the suite outcome remains authoritative."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  cabi:
    name: gmcrypto-c FFI build + header drift
    runs-on: macos-14
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cabi-stable
      # v0.4 W4 — build the cdylib + staticlib + rlib (default
      # crate-types) without the regen-header feature.
      - name: cargo build -p gmcrypto-c --release
        run: cargo build -p gmcrypto-c --release
      # Q4.12 — committed header drift gate. Re-run cbindgen and
      # `git diff --exit-code` on the header. Fails CI if a developer
      # added or modified an FFI entry point without regenerating the
      # header.
      - name: Regenerate header via cbindgen
        run: cargo build -p gmcrypto-c --features regen-header
      - name: Verify committed header is up-to-date
        run: git diff --exit-code crates/gmcrypto-c/include/gmcrypto.h
      # The c_smoke integration test exercises every FFI entry point
      # via Rust's own extern "C" interop. This is the v0.4 W4
      # cryptographic-correctness gate (Rust-equivalence on every
      # entry point). As of v0.23 W3 (A-1) the AEAD (SM4-GCM/CCM) +
      # SM4-XTS FFI is always compiled into the C ABI, so the default
      # build runs all 109 c_smoke tests (no per-feature invocation).
      - name: cargo test -p gmcrypto-c
        run: cargo test -p gmcrypto-c
      # Compile every shipped translation unit against the committed header.
      # Syntax-only avoids platform-specific linker/loader noise while still
      # catching malformed examples and stale declarations before release.
      - name: Compile shipped C examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          examples=(crates/gmcrypto-c/examples/*.c)
          if (( ${#examples[@]} == 0 )); then
            echo "::error::no shipped C examples found"
            exit 1
          fi
          for example in "${examples[@]}"; do
            echo "checking $example"
            cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
              -I crates/gmcrypto-c/include "$example"
          done

  deny:
    name: cargo-deny (no forbidden runtime deps)
    runs-on: macos-14
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt cargo-deny binary from GitHub Releases via the curated
      # taiki-e/install-action tool list. Replaces `cargo install --locked
      # cargo-deny`, which compiled from source on every CI run (~3 min).
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Cargo.lock is gitignored (lib-crate policy), so generate a fresh
      # lockfile for a reproducible, fully-resolved dependency graph before
      # the deny passes (per the documented recipe in CLAUDE.md).
      - name: Generate lockfile
        shell: bash
        run: cargo generate-lockfile
      # Default deny pass — gates the zero-runtime-deps surface of the
      # default-features build.
      - name: Run cargo-deny (default features, excluding dev-deps)
        shell: bash
        run: cargo deny --exclude-dev check
      # v0.4 W2 / Q4.5 + v0.8 W2-W3 — second pass with the runtime opt-in
      # feature flags a downstream consumer might enable (digest/cipher
      # traits, bitsliced, SIMD, AEAD, scalar). gmcrypto-c's build-time
      # `regen-header` feature is deliberately excluded (cbindgen + its
      # transitive tree is build-tool noise, not runtime dep policy).
      # Pulls `digest` / `cipher` / `crypto-common` / `inout` (allowlisted
      # in deny.toml); `sm4-aead` pulls gmcrypto-simd::ghash (no new
      # transitive deps). Uses --features on the workspace-default crate
      # (`gmcrypto-core`).
      - name: Run cargo-deny (runtime opt-in features, excluding dev-deps)
        shell: bash
        run: cargo deny --features gmcrypto-core/digest-traits,gmcrypto-core/cipher-traits,gmcrypto-core/sm4-bitsliced,gmcrypto-core/sm4-bitsliced-simd,gmcrypto-core/sm4-aead,gmcrypto-core/sm4-xts,gmcrypto-core/crypto-bigint-scalar,gmcrypto-core/sm2-key-exchange,gmcrypto-core/x509,gmcrypto-core/tlcp,gmcrypto-core/aead-traits --exclude-dev check

  wasm32:
    name: build wasm32-unknown-unknown (Rust ${{ matrix.toolchain }})
    runs-on: macos-14
    if: >-
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[ci skip]') &&
      !contains(github.event.pull_request.title, '[no ci]') &&
      !contains(github.event.pull_request.title, '[skip actions]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !contains(github.event.head_commit.message, '[skip actions]')
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.toolchain }}
        # `@stable` is the action's release tag (not the toolchain).
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
      # The `targets:` parameter above usually installs the wasm32
      # target for the named toolchain, but on GH-hosted runners it has
      # been observed to land the MSRV toolchain without the target
      # (E0463: "can't find crate for `core`"). Belt-and-braces:
      # explicitly add the target against the matrix toolchain.
      - name: Ensure wasm32 target is installed for ${{ matrix.toolchain }}
        run: rustup target add wasm32-unknown-unknown --toolchain ${{ matrix.toolchain }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-${{ matrix.toolchain }}
      # v0.4 W1 — caller-supplied RNG only; the core crate does NOT pull
      # getrandom's wasm_js backend into its default dep graph. Build with
      # --no-default-features to mirror the no_std + alloc-only posture
      # wasm callers will use. The reserved `std` feature was removed in
      # v0.5 W5 per Q5.18 (a no-op feature flag has negative documentation
      # value) — the second smoke build is dropped accordingly.
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown (no default features)
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features
      # v0.8 / v0.9 — AEAD must also compile on wasm32 (the GHASH
      # dispatch falls back to the software path; no CLMUL/PMULL there).
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features sm4-aead
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features sm4-aead
      # sm4-xts is pure-core / no_std (no new dep, no GHASH), so it must also
      # build on wasm32. (Closes the doc-vs-CI gap: CLAUDE.md documented a
      # wasm32 sm4-xts repro command with no matching CI leg.)
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features sm4-xts
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features sm4-xts
      # v1.1 — sm2-key-exchange is pure-core / no_std (no new dep), so it
      # must also build on wasm32 (caller-supplied TryCryptoRng only).
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features sm2-key-exchange
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features sm2-key-exchange
      # v1.3 — x509 is pure-core / no_std too (parse+verify, public inputs).
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features x509
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features x509
      # v1.6 — tlcp is pure-core / no_std too (key schedule: byte-in/byte-out).
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features tlcp
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features tlcp
      # v1.11 — the aead trait fit is pure-core / no_std too (aead 0.6 is
      # no_std; only its `alloc` feature is enabled, which we already have).
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features aead-traits
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features aead-traits
      # Issue #163 — sm4-bitsliced-simd must compile on wasm32 (scalar
      # sbox_x4 fallback; cpufeatures is target-gated off wasm). Portability
      # only; not a performance gate.
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features sm4-bitsliced-simd
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features sm4-bitsliced-simd
      - name: cargo +${{ matrix.toolchain }} build --target wasm32-unknown-unknown --features sm4-aead,sm4-bitsliced-simd
        run: cargo +${{ matrix.toolchain }} build -p gmcrypto-core --target wasm32-unknown-unknown --no-default-features --features sm4-aead,sm4-bitsliced-simd
