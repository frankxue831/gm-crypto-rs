name: v1.15 research control build qualification
# Research branch only. NEVER MERGE this replacement. No timing execution.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 0
            features: default
          - index: 1
            features: sm4-bitsliced
          - index: 2
            features: sm4-bitsliced-simd
          - index: 3
            features: sm4-bitsliced-simd,sm4-aead,sm4-xts,sm2-key-exchange,tlcp
    steps:
      - name: Start job clock
        shell: bash
        run: echo "V115_BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b22718fd545501ec42ce578808dcbdea22b9d9d4
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Capture effective build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          rustc = subprocess.check_output(["rustc", "-Vv"], text=True)
          cargo = subprocess.check_output(["cargo", "-V"], text=True)
          active = subprocess.check_output(["rustup", "show", "active-toolchain"], text=True)
          if not (rustc.startswith("rustc 1.95.0 (") and "host: x86_64-unknown-linux-gnu" in rustc.splitlines() and cargo.startswith("cargo 1.95.0 (") and active.split()[0] == "1.95.0-x86_64-unknown-linux-gnu"):
              raise SystemExit("wrong effective toolchain")
          if any(os.environ.get(key) for key in ("RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET")):
              raise SystemExit("unexpected build flags")
          out = pathlib.Path("evidence")
          out.joinpath("toolchain.txt").write_text(rustc + cargo + active)
          keys = ("ImageOS", "ImageVersion", "RUSTUP_TOOLCHAIN", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA")
          out.joinpath("environment.txt").write_text("".join(f"{key}={os.environ.get(key, '<unset>')}\n" for key in keys))
          for filename, command in (("source.txt", ["git", "-C", "source", "rev-parse", "HEAD", "HEAD^{tree}"]), ("cpu.txt", ["lscpu"]), ("kernel.txt", ["uname", "-a"])):
              out.joinpath(filename).write_bytes(subprocess.check_output(command))
          PYCODE
      - name: Build variants and check untimed operation counts
        timeout-minutes: 80
        shell: bash
        env:
          FEATURE_LEG: ${{ matrix.features }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/control-builds -p 'test_*.py'
          python3 research/control-builds/budget.py evidence python3 research/control-builds/prepare.py source /tmp/v115-control-builds evidence "$FEATURE_LEG"
      - name: Hash retained evidence including partial failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          root = pathlib.Path("evidence")
          if not root.exists():
              raise SystemExit("missing evidence directory")
          records = [{"path": str(p.relative_to(root)), "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob("*")) if p.is_file() and p.name != "manifest.json"]
          root.joinpath("manifest.json").write_text(json.dumps(records, indent=2) + "\n")
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v115-control-builds-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
