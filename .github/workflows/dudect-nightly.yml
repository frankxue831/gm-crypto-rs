name: dudect exporter preflight (synthetic only)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Exercise original exporter with unequal synthetic classes
        shell: bash
        run: |
          set -euo pipefail
          cp research/smoke-diagnostic/frozen.lock Cargo.lock
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PYCODE'
          import json, pathlib, shutil
          package = next(p for p in json.load(open("/tmp/metadata.json"))["packages"] if p["name"] == "dudect-bencher")
          assert package["version"] == "0.7.0"
          root = pathlib.Path("/tmp/dudect-export-test")
          shutil.copytree(pathlib.Path(package["manifest_path"]).parent, root)
          test = pathlib.Path("research/smoke-diagnostic/export-regression.rs").read_text()
          with (root / "src/ctbench.rs").open("a") as f:
              f.write(test)
          PYCODE
          cargo test --manifest-path /tmp/dudect-export-test/Cargo.toml --lib raw_export_keeps_both_labels_and_unequal_class_lengths
