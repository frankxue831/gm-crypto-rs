name: dudect build-only investigation

# Research branch only. This replaces a registered workflow solely so that
# workflow_dispatch can build a frozen source revision without timing it.
# Never merge this branch into main.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a832884a95a83488d853233da7cde5e37fc6b845
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Capture reconstruction identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          rustc = subprocess.check_output(["rustc", "-Vv"], text=True)
          cargo = subprocess.check_output(["cargo", "-V"], text=True)
          active = subprocess.check_output(["rustup", "show", "active-toolchain"], text=True)
          if not (rustc.startswith("rustc 1.95.0 (") and "host: x86_64-unknown-linux-gnu" in rustc.splitlines() and cargo.startswith("cargo 1.95.0 (") and active.split()[0] == "1.95.0-x86_64-unknown-linux-gnu"):
              raise SystemExit("wrong effective toolchain")
          out = pathlib.Path("evidence")
          out.joinpath("toolchain.txt").write_text(rustc + cargo + active)
          keys = ("ImageOS", "ImageVersion", "RUSTUP_TOOLCHAIN", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_SHA")
          out.joinpath("environment.txt").write_text("".join(f"{key}={os.environ.get(key, '<unset>')}\n" for key in keys))
          for filename, command in (("source.txt", ["git", "rev-parse", "HEAD", "HEAD^{tree}"]), ("cpu.txt", ["lscpu"]), ("kernel.txt", ["uname", "-a"])):
              out.joinpath(filename).write_bytes(subprocess.check_output(command))
          out.joinpath("LIMITATIONS.txt").write_text("Build-only reconstruction; no timing execution. Original lockfile and binary unavailable. Newly resolved dependencies and current runner image cannot prove identity with the original failed binary.\n")
          PYCODE
          cargo generate-lockfile
          cp Cargo.lock evidence/dependency-lock.txt
      - name: Build frozen source without running benchmarks
        shell: bash
        run: |
          set -euo pipefail
          FEATURES=sm4-bitsliced-simd,sm4-aead,sm4-xts,sm2-key-exchange,tlcp,crypto-bigint-scalar
          cargo metadata --locked --features "$FEATURES" --filter-platform x86_64-unknown-linux-gnu --format-version 1 > evidence/cargo-metadata.json
          cargo bench --locked --no-run --bench timing_leaks --features "$FEATURES" --message-format=json > evidence/build.json
          python3 - <<'PYCODE'
          import json, pathlib, shutil, subprocess
          out = pathlib.Path("evidence")
          executables = []
          for line in out.joinpath("build.json").read_text().splitlines():
              item = json.loads(line)
              if item.get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "timing_leaks" and item.get("executable"):
                  executables.append(item["executable"])
          if len(executables) != 1:
              raise SystemExit(f"expected one benchmark executable, got {len(executables)}")
          binary = out / "timing_leaks.bin"
          shutil.copyfile(executables[0], binary)
          with out.joinpath("timing_leaks.asm").open("w") as handle:
              subprocess.run(["objdump", "-d", "-C", str(binary)], stdout=handle, check=True)
          with out.joinpath("symbols.txt").open("w") as handle:
              subprocess.run(["nm", "-C", "--defined-only", str(binary)], stdout=handle, check=True)
          PYCODE
      - name: Hash preserved outputs
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          root = pathlib.Path("evidence")
          if not root.exists():
              raise SystemExit("missing evidence directory")
          records = [{"name": p.name, "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file() and p.name != "manifest.json"]
          root.joinpath("manifest.json").write_text(json.dumps(records, indent=2) + "\n")
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dudect-build-only-inspection
          path: evidence/
          if-no-files-found: error
          retention-days: 90
