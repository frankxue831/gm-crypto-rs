name: dudect main nightly (deeper budget)

# RESEARCH BRANCH ONLY (research/v1.17-mulvar-isolate) — never merge.
#
# This file replaces the production dudect-main.yml on this branch so that
# `gh workflow run dudect-main.yml --ref research/v1.17-mulvar-isolate`
# resolves. It runs the v1.17 isolation probes (timing_leaks.rs, `probe_*`)
# under four crypto-bigint / ctutils pairs ON THE SAME RUNNER, so the
# ct_mul_var elevation seen on EPYC 7763 under crypto-bigint 0.7.6+ can be
# attributed to a dependency version and to an arithmetic layer without the
# runner-pool heterogeneity confounding it. No gate: it only prints a table.
#
# Version pairs (the resolver forbids crypto-bigint >= 0.7.6 with ctutils
# < 0.4.5, so those cells do not exist):
#   A  crypto-bigint 0.7.5  ctutils 0.4.2   pre-advisory baseline
#   B  crypto-bigint 0.7.5  ctutils 0.4.5   ctutils change alone
#   C  crypto-bigint 0.7.6  ctutils 0.4.5   first fixed crypto-bigint
#   D  crypto-bigint 0.7.8  ctutils 0.4.5   the 1.17.0 candidate resolution
on:
  workflow_dispatch:

concurrency:
  group: dudect-isolate-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  isolate:
    name: v1.17 ct_mul_var isolation (probes x 4 dependency pairs, same runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify effective dudect toolchain
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gmcrypto-isolate

      - name: Capture runner environment
        run: |
          set +e
          echo "ImageVersion: ${ImageVersion:-<unset>}"
          uname -a
          lscpu 2>/dev/null | head -30 || head -25 /proc/cpuinfo
          echo "RUNNER-CPU: $(lscpu 2>/dev/null | grep -m1 'Model name:' | sed 's/Model name:\s*//')"

      - name: Run probes under each dependency pair
        shell: bash
        env:
          DUDECT_SAMPLES: "100000"
          DUDECT_RUNS: "3"
        run: |
          set -euxo pipefail
          cargo generate-lockfile
          run_pair () {
            local tag="$1" cb="$2" ct="$3"
            cargo update -p crypto-bigint --precise "$cb"
            cargo update -p ctutils --precise "$ct"
            grep -A1 -E 'name = "(crypto-bigint|ctutils)"' Cargo.lock
            for i in $(seq 1 "$DUDECT_RUNS"); do
              echo "=== pair $tag (crypto-bigint $cb, ctutils $ct) run $i/$DUDECT_RUNS ==="
              cargo bench --bench timing_leaks --features crypto-bigint-scalar -- --filter probe_ \
                2>&1 | tee "isolate-$tag-$i.log"
            done
          }
          run_pair A 0.7.5 0.4.2
          run_pair B 0.7.5 0.4.5
          run_pair C 0.7.6 0.4.5
          run_pair D 0.7.8 0.4.5

      - name: Summarise
        shell: bash
        run: |
          python3 - <<'PY'
          import re, glob, collections, subprocess
          pat = re.compile(r"^bench\s+(\S+)\s*\.+\s*:.*?max t\s*=\s*([+\-]?\d+\.\d+).*?max tau\s*=\s*([+\-]?\d+\.\d+)", re.M)
          cpu = subprocess.run("lscpu | grep -m1 'Model name:'", shell=True, capture_output=True, text=True).stdout.strip()
          print("RUNNER-CPU:", cpu)
          table = collections.defaultdict(dict)
          for f in sorted(glob.glob("isolate-*-*.log")):
              _, tag, i = f[:-4].split("-")
              for name, t, tau in pat.findall(open(f).read()):
                  table[name].setdefault(tag, []).append((abs(float(tau)), float(t)))
          pairs = ["A", "B", "C", "D"]
          print(f"{'probe':24}" + "".join(f"{p:>26}" for p in pairs))
          for name in sorted(table):
              row = f"{name:24}"
              for p in pairs:
                  vals = table[name].get(p, [])
                  taus = "/".join(f"{v[0]:.3f}" for v in vals) or "-"
                  row += f"{taus:>26}"
              print(row)
          print()
          print("|tau| per pass, pairs: A=cb0.7.5+ct0.4.2 B=cb0.7.5+ct0.4.5 C=cb0.7.6+ct0.4.5 D=cb0.7.8+ct0.4.5")
          PY
