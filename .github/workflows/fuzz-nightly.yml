name: fuzz nightly (cargo-fuzz)

# v0.14 — parser fuzzing (docs/v0.14-scope.md Q14.8). A capped nightly
# cargo-fuzz (libFuzzer) sweep over the untrusted-input decode/decrypt
# surface of gmcrypto-core. The invariant under test is the failure-mode
# invariant on adversarial bytes: no panic / no OOM / no hang — every
# malformed input collapses to the single safe None / Failed return.
#
# Runner: GitHub-hosted `ubuntu-latest`. libFuzzer is native on Linux
# and the targets fuzz platform-agnostic decode/decrypt logic (the
# fuzz crate enables sm4-aead + sm4-xts; SIMD only in the separate
# `fuzz-simd` job below, where the x86_64 host IS the point), so host
# arch is irrelevant to the main sweep. Moved off the self-hosted macOS
# runner at the v0.17 public flip — a self-hosted runner on a PUBLIC
# repo is remote code execution,
# and fuzzing runs adversarial native code by design, so it must not run
# on a personal machine. See docs/pre-opensource-audit.md (C1) and
# docs/v0.14-scope.md Q14.8.
#
# This is NOT a PR gate — fuzzing does not block PRs (ci.yml / the
# dudect workflows do). A real crash here is a failure-mode-invariant
# violation → fix in core + commit the minimized input as a regression
# seed (docs/v0.14-scope.md Q14.10).
#
# nightly + cargo-fuzz are installed per-run below (hosted runners start
# clean); cargo-fuzz is pinned for reproducibility.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily (after the 05:00 dudect cron)
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 'Seconds to fuzz each target'
        required: false
        default: '120'

# A partial fuzz run is still useful signal — queue behind an in-flight
# run rather than discarding it (same posture as dudect-nightly.yml).
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned for reproducibility (W0 codex finding; same posture as the
  # cbindgen 0.29 pin in gmcrypto-c).
  CARGO_FUZZ_VERSION: '0.13.2'
  # v0.20 — single source of truth for the target list, shared by the fuzz
  # sweep and the coverage job (`>-` folds the newlines into one space-
  # separated string). 33 targets: 16 from v0.14 + the 2 v0.20 streaming-
  # decryptor differentials + the 7 post-1.0 hardening targets (#98: SM3 /
  # HMAC-SM3 / C-ABI / CBC+GCM-encrypt; #99: CCM+XTS encrypt round-trips)
  # + v1.1's fuzz_sm2_kx (adversarial peer R_B/S_B bytes into the
  # key-exchange initiator's confirm) + v1.3's fuzz_x509 (certificate
  # decode + verify) + v1.7's fuzz_tlcp_{cbc,gcm}_deprotect (adversarial
  # record bodies; the CBC one drives the Lucky13 deprotect) + v1.8's
  # fuzz_x509_chain (chain + certificate-pair verification) + v1.10's
  # fuzz_sm4_xts_sectors (multi-sector vs looped single-shot) and
  # fuzz_sm4_gcm_tag_len_roundtrip (truncated-tag round-trip) + v1.11's
  # fuzz_sm4_aead_traits (aead 0.6 trait path vs the inherent path).
  # MUST list every [[bin]] in fuzz/Cargo.toml — a target missing here
  # still compiles (fuzz-build.yml builds all) but is silently never
  # fuzzed nor coverage-measured (the #98/#99 drift this note guards).
  FUZZ_TARGETS: >-
    fuzz_pem fuzz_pkcs8_decode fuzz_pkcs8_decrypt fuzz_spki fuzz_sec1 fuzz_sig
    fuzz_asn1_reader fuzz_sm2_ciphertext_der fuzz_sm2_raw_ciphertext
    fuzz_sm2_pubkey_sec1 fuzz_sm2_decrypt fuzz_sm2_verify fuzz_sm4_cbc_decrypt
    fuzz_sm4_gcm_decrypt fuzz_sm4_ccm_decrypt fuzz_sm4_xts_decrypt
    fuzz_sm4_cbc_streaming_decrypt fuzz_sm4_gcm_streaming_decrypt fuzz_sm2_kx
    fuzz_sm3 fuzz_hmac_sm3 fuzz_c_abi fuzz_sm4_cbc_encrypt
    fuzz_sm4_gcm_encrypt fuzz_sm4_ccm_encrypt fuzz_sm4_xts_encrypt fuzz_x509
    fuzz_tlcp_cbc_deprotect fuzz_tlcp_gcm_deprotect fuzz_x509_chain
    fuzz_sm4_xts_sectors fuzz_sm4_gcm_tag_len_roundtrip fuzz_sm4_aead_traits
    fuzz_sm4_ccm_streaming_decrypt fuzz_sm4_ccm_streaming_encrypt
  # Issue #163 follow-up (L0 evidence) — the subset of FUZZ_TARGETS that
  # reaches SM4 (`Sm4Cipher` directly, a mode, the TLCP record layer,
  # PKCS#8 SM4-CBC decrypt, or the C ABI). The `fuzz-simd` job re-sweeps
  # exactly these under the fuzz crate's `simd` feature
  # (= gmcrypto-core/sm4-bitsliced-simd), so the repaired `tau` →
  # `sbox_x4` composition and the `sbox_x16`/`sbox_x32` batch paths are
  # fuzzed on an x86_64 host. MUST be a subset of FUZZ_TARGETS (preflight
  # below enforces it); a new SM4-touching target goes in BOTH lists.
  FUZZ_SIMD_TARGETS: >-
    fuzz_pkcs8_decrypt fuzz_sm4_cbc_decrypt fuzz_sm4_gcm_decrypt
    fuzz_sm4_ccm_decrypt fuzz_sm4_xts_decrypt fuzz_sm4_cbc_streaming_decrypt
    fuzz_sm4_gcm_streaming_decrypt fuzz_c_abi fuzz_sm4_cbc_encrypt
    fuzz_sm4_gcm_encrypt fuzz_sm4_ccm_encrypt fuzz_sm4_xts_encrypt
    fuzz_tlcp_cbc_deprotect fuzz_tlcp_gcm_deprotect fuzz_sm4_xts_sectors
    fuzz_sm4_gcm_tag_len_roundtrip fuzz_sm4_aead_traits
    fuzz_sm4_ccm_streaming_decrypt fuzz_sm4_ccm_streaming_encrypt

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz nightly sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Hosted runners start clean — install nightly explicitly (libFuzzer
      # requires the nightly compiler's sanitizer support).
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version

      # Pinned for reproducibility (same posture as the cbindgen 0.29 pin
      # in gmcrypto-c). The guard makes a warm cache a no-op.
      - name: Install pinned cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "$CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
          fi
          cargo fuzz --version

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build

      # The FUZZ_TARGETS-names-every-[[bin]] rule was prose-only (see the note
      # above the env block) and therefore unenforced: a target added to
      # fuzz/Cargo.toml but not to FUZZ_TARGETS still COMPILES here and in
      # fuzz-build.yml, so nothing goes red — it is simply never fuzzed nor
      # coverage-measured. That is exactly the #98/#99 drift, where seven
      # targets sat unfuzzed. The list is complete today; this keeps it so.
      - name: Preflight — FUZZ_TARGETS names every [[bin]]
        run: |
          missing=""
          for b in $(grep -A1 '^\[\[bin\]\]' fuzz/Cargo.toml \
                     | sed -n 's/^name = "\(.*\)"/\1/p'); do
            case " $FUZZ_TARGETS " in
              *" $b "*) ;;
              *) missing="$missing $b" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::config drift, NOT a crash — [[bin]] target(s) absent from FUZZ_TARGETS:$missing"
            echo "Add them to FUZZ_TARGETS in this workflow, or remove the [[bin]] from fuzz/Cargo.toml."
            exit 1
          fi
          echo "FUZZ_TARGETS covers all $(echo $FUZZ_TARGETS | wc -w) [[bin]] targets"

      # Preflight census check. libFuzzer treats a NONEXISTENT corpus dir as a
      # fatal error ("No such file or directory: <dir>; exiting") and exits
      # non-zero WITHOUT running a single input — which the sweep below would
      # otherwise report as `CRASH`. That is exactly what happened when v1.7
      # added fuzz_tlcp_{cbc,gcm}_deprotect with no seeds dir: 44 consecutive
      # red nightlies that were not crashes, while those two targets were in
      # truth never fuzzed at all. Failing HERE, with a distinct message,
      # keeps a config drift from ever again masquerading as a crash.
      - name: Preflight — every target has a seeds dir
        run: |
          missing=""
          for t in $FUZZ_TARGETS; do
            [ -d "fuzz/seeds/$t" ] || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::config drift, NOT a crash — missing fuzz/seeds/<target>/ for:$missing"
            echo "Add a curated seed dir per fuzz/README.md, or drop the target from FUZZ_TARGETS."
            exit 1
          fi
          echo "seeds dir present for all $(echo $FUZZ_TARGETS | wc -w) targets"

      - name: Fuzz each target (capped)
        run: |
          BUDGET="${{ github.event.inputs.max_total_time || '120' }}"
          failed=""
          for t in $FUZZ_TARGETS; do
            echo "::group::$t"
            mkdir -p "fuzz/corpus/$t"
            # Pass only dirs that exist — belt-and-braces behind the preflight,
            # so a nonexistent path can never reach libFuzzer as a fake crash.
            dirs="fuzz/corpus/$t"
            [ -d "fuzz/seeds/$t" ] && dirs="$dirs fuzz/seeds/$t"
            # shellcheck disable=SC2086
            if cargo +nightly fuzz run "$t" $dirs -- \
                 -max_len=16384 -rss_limit_mb=2048 -timeout=25 \
                 -max_total_time="$BUDGET"; then
              echo "PASS $t"
            else
              echo "CRASH $t"
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz crash(es) in:$failed"
            exit 1
          fi

      # On a crash, libFuzzer wrote a reproducer under fuzz/artifacts/.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  # Issue #163 follow-up (L0 evidence) — the same capped sweep, restricted to
  # FUZZ_SIMD_TARGETS and built with the fuzz crate's `simd` feature. A
  # SEPARATE job, parallel to `fuzz`, for two reasons: (1) features are
  # additive, so folding the flag into the main sweep would stop fuzzing
  # the portable S-box that the default build ships; (2) seventeen extra
  # targets at the default budget would push the main job past its
  # timeout. Same preflights, same crash semantics, own artifact name.
  fuzz-simd:
    name: cargo-fuzz nightly sweep (sm4-bitsliced-simd profile)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly --version

      - name: Install pinned cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "$CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
          fi
          cargo fuzz --version

      - name: Build all fuzz targets (--features simd)
        run: cargo +nightly fuzz build --features simd

      # FUZZ_SIMD_TARGETS ⊆ FUZZ_TARGETS, and every listed target must exist
      # as a [[bin]] (a typo here would otherwise surface as a cargo error
      # inside the sweep and read like a crash). Same config-drift-is-not-
      # a-crash posture as the main job's preflights.
      - name: Preflight — FUZZ_SIMD_TARGETS is a subset of FUZZ_TARGETS and of [[bin]]s
        run: |
          bins=" $(grep -A1 '^\[\[bin\]\]' fuzz/Cargo.toml \
                   | sed -n 's/^name = "\(.*\)"/\1/p' | tr '\n' ' ') "
          missing=""
          for t in $FUZZ_SIMD_TARGETS; do
            case " $FUZZ_TARGETS " in *" $t "*) ;; *) missing="$missing $t(not-in-FUZZ_TARGETS)" ;; esac
            case "$bins" in *" $t "*) ;; *) missing="$missing $t(no-[[bin]])" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::config drift, NOT a crash — FUZZ_SIMD_TARGETS entries:$missing"
            exit 1
          fi
          echo "FUZZ_SIMD_TARGETS: $(echo $FUZZ_SIMD_TARGETS | wc -w) targets, all in FUZZ_TARGETS and fuzz/Cargo.toml"

      - name: Preflight — every SIMD target has a seeds dir
        run: |
          missing=""
          for t in $FUZZ_SIMD_TARGETS; do
            [ -d "fuzz/seeds/$t" ] || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::config drift, NOT a crash — missing fuzz/seeds/<target>/ for:$missing"
            exit 1
          fi
          echo "seeds dir present for all $(echo $FUZZ_SIMD_TARGETS | wc -w) SIMD targets"

      - name: Fuzz each SIMD target (capped, --features simd)
        run: |
          BUDGET="${{ github.event.inputs.max_total_time || '120' }}"
          failed=""
          for t in $FUZZ_SIMD_TARGETS; do
            echo "::group::$t (simd)"
            mkdir -p "fuzz/corpus/$t"
            dirs="fuzz/corpus/$t"
            [ -d "fuzz/seeds/$t" ] && dirs="$dirs fuzz/seeds/$t"
            # shellcheck disable=SC2086
            if cargo +nightly fuzz run --features simd "$t" $dirs -- \
                 -max_len=16384 -rss_limit_mb=2048 -timeout=25 \
                 -max_total_time="$BUDGET"; then
              echo "PASS $t (simd)"
            else
              echo "CRASH $t (simd)"
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz crash(es) under --features simd in:$failed"
            exit 1
          fi

      - name: Upload crash artifacts (simd)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-simd
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  # v0.20 (Q20.3) — coverage report. A SEPARATE job (parallel to `fuzz`) so a
  # coverage-tooling hiccup can never mask a real fuzz crash, and vice versa.
  # This is NOT a gate on coverage NUMBERS: the percentage is never
  # thresholded, and the report artifact stays the deliverable. It IS a gate on
  # a target producing no coverage data AT ALL — see the tail of the generate
  # step, where the table is also appended to the run's job summary, because an
  # artifact nobody opens is not a report (#121). Coverage replays the
  # COMMITTED `seeds/` (the gitignored `corpus/` is empty on a clean checkout)
  # — i.e. seed-corpus coverage; growing-corpus coverage is a later refinement.
  coverage:
    name: cargo-fuzz coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly + llvm-tools
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add llvm-tools-preview --toolchain nightly
          rustc +nightly --version

      - name: Install pinned cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q "$CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
          fi
          cargo fuzz --version

      - name: Generate per-target coverage + summary
        run: |
          LLVM_COV="$(find "$(rustc +nightly --print sysroot)" -name llvm-cov -type f | head -1)"
          echo "llvm-cov: ${LLVM_COV:-<not found>}"
          mkdir -p fuzz/coverage
          SUMMARY=fuzz/coverage/SUMMARY.txt
          : > "$SUMMARY"
          for t in $FUZZ_TARGETS; do
            echo "::group::coverage $t"
            mkdir -p "fuzz/corpus/$t"
            # Same nonexistent-dir hazard as the sweep job: a missing seeds dir
            # makes libFuzzer exit before instrumenting anything, which used to
            # surface here as a misleading `coverage-build-failed`.
            dirs="fuzz/corpus/$t"
            [ -d "fuzz/seeds/$t" ] && dirs="$dirs fuzz/seeds/$t"
            # Replay corpus+seeds through an instrumented build → coverage.profdata.
            # shellcheck disable=SC2086
            if cargo +nightly fuzz coverage "$t" $dirs; then
              prof="fuzz/coverage/$t/coverage.profdata"
              # Locate the coverage-instrumented binary anywhere under the repo or
              # cargo target tree (its subpath varies by cargo-fuzz/host), excluding
              # build sidecars. Whole-tree search avoids brittle path assumptions.
              bin="$(find . "$HOME/.cargo" -type f -name "$t" 2>/dev/null | grep -E '/(coverage|release|debug)/' | grep -Ev '\.(d|rlib|rmeta|o)$' | head -1)"
              if [ -n "$LLVM_COV" ] && [ -f "$prof" ] && [ -n "$bin" ]; then
                line="$("$LLVM_COV" report "$bin" -instr-profile="$prof" 2>/dev/null | tail -1)"
                printf '%-34s %s\n' "$t" "${line:-render-failed (bin=$bin)}" | tee -a "$SUMMARY"
              elif [ -f "$prof" ]; then
                # Profdata IS the coverage data (the real artifact); rendering is a
                # convenience. Report honestly + point at the local render recipe.
                sz="$(wc -c < "$prof" 2>/dev/null || echo 0)"
                printf '%-34s %s\n' "$t" "profdata OK (${sz} bytes); render locally per fuzz/README.md (bin=${bin:-unresolved})" | tee -a "$SUMMARY"
              else
                printf '%-34s %s\n' "$t" "coverage-build-failed" | tee -a "$SUMMARY"
              fi
            else
              printf '%-34s %s\n' "$t" "coverage-build-failed" | tee -a "$SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "===== coverage summary (seed-corpus) ====="
          cat "$SUMMARY"

          # Render the table on the run page. Uploading it as an artifact and
          # stopping there meant seeing it required knowing the artifact
          # existed, downloading the zip and opening a text file — so for 44
          # consecutive nights this file reported `coverage-build-failed` for
          # both fuzz_tlcp_*_deprotect targets (i.e. they were executing zero
          # inputs) and nobody looked. The artifact upload below is unchanged;
          # this adds visibility, it does not replace the deliverable.
          {
            echo '### Fuzz coverage (seed corpus)'
            echo
            echo '```'
            cat "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # ...and fail on the one line that means "this target produced no
          # coverage data at all". Still NOT a %-gate — the percentage is never
          # thresholded, and a profdata that merely failed to RENDER falls to
          # the `profdata OK` branch above, so it cannot trip this. Same posture
          # as the two preflights in the sweep job: a config/tooling failure
          # must never pass green, and must never be mistaken for a crash.
          # Written after the step summary above, deliberately, so the table
          # still renders on the failing run.
          nodata="$(awk '/coverage-build-failed/ {printf " %s", $1}' "$SUMMARY")"
          if [ -n "$nodata" ]; then
            echo "::error::produced NO coverage data, NOT a fuzz crash — target(s):$nodata"
            echo "A target that cannot be coverage-built may not be running at all; reproduce per fuzz/README.md."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-coverage
          path: |
            fuzz/coverage/SUMMARY.txt
            fuzz/coverage/**/coverage.profdata
          retention-days: 30
          if-no-files-found: warn
