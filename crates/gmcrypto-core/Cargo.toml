[package]
name = "gmcrypto-core"
description = "Constant-time-designed pure-Rust SM2/SM3/SM4 primitives (no_std + alloc) with an in-CI dudect timing-leak regression harness"
# v1.11.2 — `sm4` was missing from a crate that implements it, at the 5-keyword
# cap. Dropped: `gm-crypto` (self-coined, one crate carries it) and `no-std`
# (already declared as a category). `shangmi` is the term RustCrypto's own
# sm2/sm9 crates index under.
keywords = ["sm2", "sm3", "sm4", "shangmi", "constant-time"]
categories = ["cryptography", "no-std"]
readme = "../../README.md"
documentation = "https://docs.rs/gmcrypto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# v0.4 — docs.rs builds with default features only by default. The
# v0.4 W2 / W3 opt-in features (`digest-traits` / `cipher-traits` /
# `sm4-bitsliced`) are the headline ergonomics work and need to
# appear on the rendered docs page. `all-features = true` is fine
# here: the three feature flags are additive and pulling all
# optional deps for docs.rs has no runtime impact.
[package.metadata.docs.rs]
all-features = true
# v1.11.2 — sets the `docsrs` cfg that turns on `feature(doc_cfg)` in lib.rs,
# which is what makes docs.rs badge every gated item with the feature that
# unlocks it. Without this line `all-features` documents the gated API but
# says nothing about how to reach it. See the comment at the attribute.
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
crypto-bigint.workspace = true
subtle.workspace = true
zeroize.workspace = true
rand_core.workspace = true
spin.workspace = true
# v0.4 W2 — optional RustCrypto-trait fit. Default-features-off build
# does NOT pull these in. v0.11 migrated to digest 0.11 / cipher 0.5
# (the crypto-common 0.2 / hybrid-array generation; see
# docs/v0.11-scope.md). Default builds are unaffected.
digest = { version = "0.11", default-features = false, features = ["mac"], optional = true }
cipher = { version = "0.5", default-features = false, optional = true }
# v1.11 — opt-in RustCrypto `aead` 0.6 trait fit for SM4-GCM / SM4-CCM.
# `alloc` is REQUIRED, not decorative: both the `Aead` blanket impl over
# `AeadInOut` and `Buffer for Vec<u8>` are `cfg(feature = "alloc")`.
# Default features stay OFF — the default pulls `rand_core`, which this
# fit never uses. Adds no new transitive deps: aead 0.6 needs only
# crypto-common 0.2 + inout 0.2, both already in-tree since v0.11.
aead = { version = "0.6.1", default-features = false, features = ["alloc"], optional = true }
# v0.5 W4 phase 2 — sibling crate carrying the AVX2 8-way packed
# bitsliced SM4 S-box (and NEON in phase 3). Quarantines the
# unavoidable `unsafe` of SIMD intrinsics so `gmcrypto-core` itself
# can keep `unsafe_code = "forbid"`. Mirrors the established
# `gmcrypto-c` precedent for FFI primitives. Only pulled in when
# `sm4-bitsliced-simd` is enabled — default builds never touch it.
gmcrypto-simd = { path = "../gmcrypto-simd", version = "=1.12.0", default-features = false, optional = true }

[dev-dependencies]
hex-literal.workspace = true
getrandom.workspace = true
dudect-bencher.workspace = true

[[bench]]
name = "timing_leaks"
path = "benches/timing_leaks.rs"
harness = false
# v0.5 W5 — the bench harness exercises `Sm2PrivateKey::from_scalar`
# (renamed from `new` in v0.5 W5), which is gated behind
# `crypto-bigint-scalar`. The bench is run with this feature enabled
# via the CI workflow's `cargo bench --bench timing_leaks --features
# crypto-bigint-scalar`. Local runs must do the same.
required-features = ["crypto-bigint-scalar"]

[[test]]
name = "rustcrypto_traits"
path = "tests/rustcrypto_traits.rs"
required-features = ["digest-traits", "cipher-traits"]

# v1.11 (Q11.10) — a SEPARATE test target, deliberately. Folding the aead
# cases into `rustcrypto_traits` would widen that target's
# required-features to all three trait flags, and the existing CI leg
# (`--features digest-traits,cipher-traits`) would then silently stop
# running it. A test file that quietly stops executing is worse than one
# that fails.
[[test]]
name = "rustcrypto_aead_traits"
path = "tests/rustcrypto_aead_traits.rs"
required-features = ["aead-traits"]

[features]
default = []
# v0.4 W2 — opt-in RustCrypto-trait fit. Two flags per Q4.3 so
# callers needing only one half don't pay for both. Default-features
# build is unchanged.
digest-traits = ["dep:digest"]
cipher-traits = ["dep:cipher"]
# v1.11 (Q11.6) — opt-in `aead` 0.6 trait fit for SM4-GCM / SM4-CCM.
# Pulls `sm4-aead` because the trait impls are thin wrappers over
# `mode_gcm` / `mode_ccm`, which live behind that flag. The impls add no
# cryptography: every failure funnels into the one opaque `aead::Error`,
# so the failure-mode invariant crosses the trait boundary intact.
aead-traits = ["sm4-aead", "dep:aead"]
# v0.5 W5 (Q5.17) — opt-in `crypto_bigint::U256` constructor for
# `Sm2PrivateKey`. The always-on `Sm2PrivateKey::from_bytes_be(&[u8;
# 32])` is the recommended path for callers who don't want a
# transitive `crypto-bigint` major-version dep. Enabling this feature
# unlocks `Sm2PrivateKey::from_scalar(d: U256)` for callers already
# carrying `crypto-bigint`.
crypto-bigint-scalar = []
# NOTE — `std` feature flag removed in v0.5 W5 (Q5.18). It had been a
# no-op reservation since v0.3; a reserved flag without contents is
# worse than no flag (callers wondered what it did, docs had to
# explain "nothing yet"). If a future v0.5.x ships a file-I/O helper,
# it gets a specific feature name like `std-file-io`.
# v0.4 W3 — bitsliced (table-less, gate-only) SM4 S-box. Boyar-Peralta-
# style Itoh-Tsujii inversion in GF(2^8) plus two affine
# transformations. Default-off (Q4.9 in docs/v0.4-scope.md); callers
# opt in. Byte-identical output to the default linear-scan S-box;
# constant-time by construction (no table lookups, no branches on
# secret bits). Single-block only for v0.4; multi-block SIMD-packed
# bitslicing deferred to v0.5+ per Q4.11.
sm4-bitsliced = []
# v0.5 W4 — multi-block SIMD-packed bitsliced SM4 S-box. Stacks on
# `sm4-bitsliced`'s gate-only S-box circuit, packing 8 (AVX2) /
# 4 (NEON) blocks in parallel. Default-off (Q5.15 in
# docs/v0.5-scope.md).
#
# `sm4-bitsliced-simd` pulls `gmcrypto-simd`. Serial `tau` uses the
# four-byte `sbox_x4` entry (issue #163); full batches use `sbox_x16`
# / `sbox_x32`. The one-byte-to-x8 adapter is removed. See
# `crates/gmcrypto-core/src/sm4/sbox_bitsliced_simd.rs` and
# `docs/sm4-single-block-simd-repair-design.md`.
sm4-bitsliced-simd = ["sm4-bitsliced", "dep:gmcrypto-simd"]
# v0.8 W2 / W3 — AEAD modes: SM4-GCM (mode_gcm) + SM4-CCM (mode_ccm)
# single-shot, per docs/v0.7-aead-scope.md. Default-off (additive;
# zero impact on the default-features build). Pulls in
# `gmcrypto-simd` for the GHASH primitive (v0.8 W1) — GHASH dispatches
# at runtime to CLMUL on x86_64 / PMULL on aarch64 / software fallback
# elsewhere. See the module docstrings on `sm4::mode_gcm` and
# `sm4::mode_ccm` for nonce-uniqueness and tag-length contracts.
sm4-aead = ["dep:gmcrypto-simd"]
# v0.12 — SM4-XTS (tweakable mode for disk/sector encryption) per
# GB/T 17964-2021 (GM-T OID 1.2.156.10197.1.104.10). Pure-core (no
# gmcrypto-simd dep — the XTS tweak update is a trivial GF(2^128)
# doubling in the bit-reflected convention, not GHASH's full multiply);
# whole-block bulk rides the Sm4Cipher batch API (picks up SIMD fanout
# under sm4-bitsliced-simd). Default-off; byte-identical to OpenSSL 3.x
# EVP SM4-XTS (xts_standard=GB). See docs/v0.12-scope.md.
sm4-xts = []
# v1.1 — SM2 key exchange (GM/T 0003.3 ≡ GB/T 32918.3-2016) with key
# confirmation. Pure-core (no dep — reuses the SM2 curve, masked sampler,
# SM3 KDF, compute_z, point validation). Default-off; default build
# byte-identical. See docs/v1.1-sm2-key-exchange-design.md.
sm2-key-exchange = []
# v1.3 — X.509-with-SM2 leaf certificate parse + signature verify. Pure-core
# (no dep — composes asn1::reader, spki::decode, verify_with_id). NO trust
# decisions (no chains/time/extensions/revocation). Default-off; default
# build byte-identical. See docs/v1.3-x509-sm2-design.md.
x509 = []
# v1.6 — TLCP (GB/T 38636-2020) crypto toolkit umbrella. Carries the
# whole toolkit arc (v1.6 key schedule; v1.7 record protection and v1.8
# chain/pair verification join under the same flag — Q6.2 of
# docs/v1.6-scope.md). Pure-core (no dep — composes hmac::HmacSm3),
# no_std-compatible. Does NOT imply sm2-key-exchange: the v1.6
# no-confirmation KX completers are 32918.3 generality and live on that
# feature (Q6.3); a TLCP consumer enables both. Default-off; default
# build byte-identical.
tlcp = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"     # we use sm2::Sm2Curve etc.
must_use_candidate = "allow"
